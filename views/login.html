<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>로그인 · 동아일보 채용 인스타그램 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    font-family: 'Pretendard', -apple-system, sans-serif; color: #10231d;
    background: linear-gradient(160deg, #041713, #0a2e27 55%, #0f3d33);
    overflow-x: hidden;
  }
  ::selection { background: #b4f5e0; color: #041713; }
  .card { position: relative; z-index: 2; width: 100%; max-width: 400px; background: #fff; border-radius: 16px; padding: 30px 28px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  h1 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }
  .sub { margin: 0 0 20px; font-size: 13px; color: #52655e; line-height: 1.6; }
  .tabs { display: flex; gap: 4px; background: #eef2f0; padding: 4px; border-radius: 10px; margin-bottom: 20px; }
  .tab { flex: 1; padding: 9px; border: none; border-radius: 7px; background: none; font: inherit; font-size: 14px; font-weight: 700; color: #52655e; cursor: pointer; }
  .tab[aria-selected="true"] { background: #fff; color: #10231d; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 12.5px; font-weight: 700; color: #52655e; margin-bottom: 6px; }
  input { width: 100%; font: inherit; font-size: 15px; padding: 11px 12px; border: 1px solid #d7ddda; border-radius: 9px; color: #10231d; }
  input:focus { outline: 2px solid #22a488; outline-offset: 1px; border-color: #22a488; }
  .pin { letter-spacing: 0.35em; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  button.primary {
    width: 100%; margin-top: 6px; padding: 12px; border: none; border-radius: 9px; font: inherit; font-size: 14.5px; font-weight: 700;
    color: #fff; background: linear-gradient(135deg, #15594a, #1f7a66); cursor: pointer;
  }
  button.primary:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 13px; line-height: 1.5; }
  .msg.err { color: #b8283f; }
  .msg.ok { color: #15594a; }
  .hint { margin-top: 16px; padding-top: 14px; border-top: 1px solid #e7e9f0; font-size: 12px; color: #52655e; line-height: 1.6; }

  /* ---------- 배경 모션그래픽: 계정의 네 장면(성장·좋아요·인터뷰·설명회) ---------- */
  .stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .stage::after { /* 가운데 로그인 카드 주변을 살짝 어둡게 눌러 카드에 시선이 모이게 */
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 34% 46% at 50% 50%, rgba(4, 23, 19, .55), transparent 72%);
  }
  .scene {
    position: absolute; width: 330px; padding: 16px 18px 18px; border-radius: 14px;
    background: rgba(255, 255, 255, .055); border: 1px solid rgba(180, 245, 224, .16);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .28); color: #d6f3ea; opacity: .9;
    animation: drift 14s ease-in-out infinite alternate;
  }
  .scene svg { display: block; width: 100%; height: auto; overflow: visible; }
  .s-profile { top: 9vh; left: 6vw; }
  .s-likes { top: 11vh; right: 6vw; width: 280px; animation-delay: -4s; }
  .s-interview { bottom: 9vh; left: 9vw; animation-delay: -8s; }
  .s-session { bottom: 11vh; right: 7vw; animation-delay: -2s; }
  @keyframes drift { from { transform: translateY(-6px); } to { transform: translateY(8px); } }

  .sc-label { font-size: 11.5px; font-weight: 700; color: #b4f5e0; letter-spacing: .02em; }
  .sc-num { font-variant-numeric: tabular-nums; font-weight: 800; color: #fff; }

  /* 장면 1: 프로필 */
  .prof { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .prof-ring { width: 42px; height: 42px; border-radius: 50%; padding: 2px; background: conic-gradient(#2fc79f, #b4f5e0, #22a488, #2fc79f); flex-shrink: 0; }
  .prof-ring span { display: block; width: 100%; height: 100%; border-radius: 50%; background: #0a2e27; border: 2px solid #0a2e27; }
  .prof-ring svg { width: 100%; height: 100%; }
  .prof-handle { font-size: 13px; font-weight: 800; color: #fff; }
  .prof-sub { font-size: 11px; color: #9fd9c6; margin-top: 2px; }
  .growth-dot { filter: drop-shadow(0 0 6px #2fc79f); }
  .growth-line { fill: none; stroke: #2fc79f; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .growth-area { fill: url(#growthFill); }

  /* 장면 2: 좋아요 */
  .post-tile { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1 / 1; background: linear-gradient(150deg, #15594a, #0f3d33); }
  .post-tile svg.cover { position: absolute; inset: 0; }
  .likes-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; }
  .scene .likes-row svg { width: 18px; height: 18px; }
  .scene .post-tile .heart { position: absolute; bottom: 10px; right: 14px; width: 22px; height: 22px; opacity: 0;
    animation: rise 3.2s cubic-bezier(.16, 1, .3, 1) infinite; }
  .scene .post-tile .heart:nth-child(2) { right: 34px; width: 16px; height: 16px; animation-delay: .5s; }
  .scene .post-tile .heart:nth-child(3) { right: 8px; width: 18px; height: 18px; animation-delay: 1.1s; }
  .scene .post-tile .heart:nth-child(4) { right: 46px; width: 14px; height: 14px; animation-delay: 1.6s; }
  .scene .post-tile .heart:nth-child(5) { right: 22px; width: 20px; height: 20px; animation-delay: 2.2s; }
  .scene .post-tile .heart:nth-child(6) { right: 58px; width: 15px; height: 15px; animation-delay: 2.7s; }
  @keyframes rise {
    0% { opacity: 0; transform: translate(0, 0) scale(.6); }
    15% { opacity: 1; transform: translate(-3px, -18px) scale(1.05); }
    70% { opacity: .9; }
    100% { opacity: 0; transform: translate(10px, -150px) scale(.9); }
  }

  /* 장면 3: 인터뷰 */
  .bubble { opacity: 0; animation: talk 6s ease-in-out infinite; }
  .bubble.b2 { animation-delay: 3s; }
  @keyframes talk { 0%, 8% { opacity: 0; transform: translateY(4px); } 14%, 44% { opacity: 1; transform: none; } 50%, 100% { opacity: 0; } }
  .dot { animation: blink 1.2s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .rec { animation: rec 1.6s steps(1) infinite; }
  @keyframes rec { 50% { opacity: .2; } }

  /* 장면 4: 설명회 */
  .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 5s cubic-bezier(.16, 1, .3, 1) infinite; }
  .bar:nth-of-type(2) { animation-delay: .25s; } .bar:nth-of-type(3) { animation-delay: .5s; } .bar:nth-of-type(4) { animation-delay: .75s; }
  @keyframes grow { 0% { transform: scaleY(.08); } 35%, 85% { transform: scaleY(1); } 100% { transform: scaleY(.08); } }
  .head { transform-box: fill-box; transform-origin: bottom; animation: nod 3.4s ease-in-out infinite; }
  .head:nth-child(2n) { animation-delay: -1.2s; } .head:nth-child(3n) { animation-delay: -2.3s; }
  @keyframes nod { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
  .pointer { transform-box: view-box; transform-origin: 0 0; animation: point 5s ease-in-out infinite; }
  @keyframes point { 0%, 100% { transform: rotate(0deg); } 40%, 70% { transform: rotate(-22deg); } }

  @media (min-width: 1360px) {
    .scene { width: 380px; } .s-likes { width: 310px; }
  }
  @media (max-width: 1080px) {
    .scene { transform: scale(.82); }
    .s-profile { left: 2vw; } .s-likes { right: 2vw; } .s-interview { left: 3vw; } .s-session { right: 2vw; }
  }
  @media (max-width: 760px) {
    .s-interview, .s-session, .cursor, .toast { display: none; }
    .scene { opacity: .45; }
    .s-profile { top: 2vh; left: -40px; } .s-likes { top: auto; bottom: 2vh; right: -30px; }
  }
  /* 장면 사이를 오가는 커서(인사팀·지원자) */
  .cursor { position: absolute; top: 0; left: 0; z-index: 3; display: flex; align-items: flex-start; gap: 2px;
    transform: translate(-80px, -80px); transition: transform 1.7s cubic-bezier(.65, 0, .35, 1); will-change: transform; }
  .cursor svg { width: 20px; height: 20px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); }
  .cursor .tag { margin-top: 14px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #04201a; white-space: nowrap; }
  .cursor.c1 .tag { background: #b4f5e0; } .cursor.c2 .tag { background: #ffb3ba; }
  .cursor .ripple { position: absolute; left: -10px; top: -10px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid currentColor; opacity: 0; }
  .cursor.c1 { color: #b4f5e0; } .cursor.c2 { color: #ffb3ba; }
  .cursor.click .ripple { animation: ripple .55s cubic-bezier(.16, 1, .3, 1); }
  @keyframes ripple { from { opacity: .9; transform: scale(.3); } to { opacity: 0; transform: scale(1.8); } }

  /* 가끔 떠오르는 알림 */
  .toast { position: absolute; z-index: 3; padding: 7px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; color: #04201a;
    background: #e9fbf4; box-shadow: 0 10px 24px rgba(0, 0, 0, .3); opacity: 0; transform: translateY(8px);
    transition: opacity .35s ease, transform .5s cubic-bezier(.16, 1, .3, 1); white-space: nowrap; }
  .toast.show { opacity: 1; transform: none; }
  .like-pop { position: absolute; font-size: 11px; font-weight: 800; color: #ff8d97; pointer-events: none; animation: pop 1s cubic-bezier(.16, 1, .3, 1) forwards; }
  @keyframes pop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-16px); } }
  .scene.burst .post-tile { animation: thump .45s cubic-bezier(.16, 1, .3, 1); }
  @keyframes thump { 40% { transform: scale(1.035); } }
  .s-interview.talking .bubble { animation: none; opacity: 1; }
  .scene.flash { border-color: rgba(180, 245, 224, .55); transition: border-color .3s; }

  .stage.paused, .stage.paused * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) {
    .scene, .bubble, .dot, .rec, .bar, .head, .pointer { animation: none !important; }
    .cursor, .toast { display: none; }
    .bubble { opacity: 1; } .scene .post-tile .heart { display: none; }
  }
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
  <div class="cursor c1" id="cursor1"><span class="ripple"></span><svg viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.6 3.8 7.3-2.9 1.5-3.8-7.3L4 19.5z" fill="currentColor" stroke="#04201a" stroke-width="1.2" stroke-linejoin="round"/></svg><span class="tag">인사팀</span></div>
  <div class="cursor c2" id="cursor2"><span class="ripple"></span><svg viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.6 3.8 7.3-2.9 1.5-3.8-7.3L4 19.5z" fill="currentColor" stroke="#04201a" stroke-width="1.2" stroke-linejoin="round"/></svg><span class="tag">지원자</span></div>
  <div class="toast" id="toast"></div>

  <section class="scene s-profile">
    <div class="prof">
      <div class="prof-ring"><span><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="11" fill="none" stroke="#2fc79f" stroke-width="2"/><path d="M9 20h22M20 9v22M12.5 12.5l15 15M27.5 12.5l-15 15" stroke="#2fc79f" stroke-width="1.4"/></svg></span></div>
      <div>
        <div class="prof-handle">donga_recruit</div>
        <div class="prof-sub">팔로워 성장</div>
      </div>
    </div>
    <svg viewBox="0 0 240 122" role="presentation">
      <defs><linearGradient id="growthFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fc79f" stop-opacity=".35"/><stop offset="1" stop-color="#2fc79f" stop-opacity="0"/></linearGradient></defs>
      <path class="growth-area" id="growthArea" d=""/>
      <path class="growth-line" id="growthLine" d=""/>
      <line x1="0" y1="104" x2="240" y2="104" stroke="#2fc79f" stroke-opacity=".2"/>
      <circle class="growth-dot" id="growthDot" r="4.5" fill="#b4f5e0" cx="-10" cy="-10"/>
      <text x="0" y="120" font-size="9" fill="#7fbfab">25.11</text><text x="240" y="120" font-size="9" fill="#7fbfab" text-anchor="end">26.11</text>
    </svg>
  </section>

  <section class="scene s-likes">
    <div class="post-tile">
      <svg class="cover" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="10" y="14" width="56" height="7" rx="3" fill="#b4f5e0" opacity=".85"/><rect x="10" y="26" width="40" height="5" rx="2.5" fill="#b4f5e0" opacity=".45"/><rect x="10" y="62" width="80" height="24" rx="5" fill="#0a2e27" opacity=".55"/><rect x="16" y="68" width="46" height="4" rx="2" fill="#2fc79f"/><rect x="16" y="76" width="30" height="4" rx="2" fill="#2fc79f" opacity=".6"/><circle cx="80" cy="30" r="10" fill="#2fc79f" opacity=".35"/></svg>
      <svg class="heart" viewBox="0 0 24 24" fill="#ff6b78"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg class="heart" viewBox="0 0 24 24" fill="#ff8d97"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg class="heart" viewBox="0 0 24 24" fill="#ff6b78"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg class="heart" viewBox="0 0 24 24" fill="#ffb3ba"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg class="heart" viewBox="0 0 24 24" fill="#ff6b78"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg class="heart" viewBox="0 0 24 24" fill="#ff8d97"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </div>
    <div class="likes-row"><svg viewBox="0 0 24 24" fill="#ff6b78"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg><span>좋아요 <b class="sc-num" id="pLikes">0</b>개</span></div>
  </section>

  <section class="scene s-interview">
    <svg viewBox="0 0 240 132" role="presentation">
      <rect x="0" y="0" width="240" height="132" rx="10" fill="#0a2e27" opacity=".5"/>
      <circle class="rec" cx="14" cy="14" r="4" fill="#ff6b78"/><text x="24" y="17.5" font-size="9.5" fill="#d6f3ea" font-weight="700">INTERVIEW</text>
      <!-- 진행자 -->
      <circle cx="62" cy="64" r="13" fill="#9fd9c6"/><path d="M40 118c0-17 10-28 22-28s22 11 22 28z" fill="#22a488"/>
      <!-- 현직자 -->
      <circle cx="176" cy="62" r="13" fill="#d6f3ea"/><path d="M154 118c0-17 10-28 22-28s22 11 22 28z" fill="#2fc79f"/>
      <!-- 마이크 -->
      <rect x="114" y="74" width="9" height="16" rx="4.5" fill="#b4f5e0"/><path d="M118.5 90v22M108 112h21" stroke="#b4f5e0" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="20" y="118" width="200" height="5" rx="2.5" fill="#15594a"/>
      <g class="bubble"><rect x="20" y="22" width="64" height="24" rx="12" fill="#d6f3ea"/><circle class="dot" cx="40" cy="34" r="3" fill="#0f3d33"/><circle class="dot" cx="52" cy="34" r="3" fill="#0f3d33"/><circle class="dot" cx="64" cy="34" r="3" fill="#0f3d33"/></g>
      <g class="bubble b2"><rect x="146" y="20" width="76" height="24" rx="12" fill="#2fc79f"/><rect x="156" y="27" width="56" height="4" rx="2" fill="#0a2e27"/><rect x="156" y="35" width="36" height="4" rx="2" fill="#0a2e27" opacity=".6"/></g>
    </svg>
  </section>

  <section class="scene s-session">
    <svg viewBox="0 0 240 140" role="presentation">
      <!-- 스크린 -->
      <rect x="64" y="6" width="168" height="78" rx="6" fill="#0a2e27" stroke="#2fc79f" stroke-opacity=".5"/>
      <text x="76" y="24" font-size="10" fill="#d6f3ea" font-weight="800">채용설명회</text>
      <rect class="bar" x="152" y="44" width="12" height="32" rx="2" fill="#2fc79f" opacity=".55"/>
      <rect class="bar" x="170" y="34" width="12" height="42" rx="2" fill="#2fc79f" opacity=".7"/>
      <rect class="bar" x="188" y="26" width="12" height="50" rx="2" fill="#2fc79f" opacity=".85"/>
      <rect class="bar" x="206" y="16" width="12" height="60" rx="2" fill="#b4f5e0"/>
      <rect x="76" y="34" width="56" height="4" rx="2" fill="#9fd9c6" opacity=".6"/><rect x="76" y="42" width="40" height="4" rx="2" fill="#9fd9c6" opacity=".4"/>
      <!-- 발표자 -->
      <circle cx="30" cy="46" r="11" fill="#d6f3ea"/><path d="M12 104c0-22 7-40 18-40s18 18 18 40z" fill="#22a488"/>
      <g transform="translate(40 66)"><g class="pointer"><path d="M0 0l30 -6" stroke="#b4f5e0" stroke-width="3" stroke-linecap="round"/></g></g>
      <!-- 지원자들 -->
      <g fill="#9fd9c6" opacity=".75">
        <circle class="head" cx="72" cy="112" r="8"/><circle class="head" cx="96" cy="114" r="8"/><circle class="head" cx="120" cy="112" r="8"/><circle class="head" cx="144" cy="114" r="8"/><circle class="head" cx="168" cy="112" r="8"/><circle class="head" cx="192" cy="114" r="8"/><circle class="head" cx="216" cy="112" r="8"/>
      </g>
      <g fill="#15594a"><rect x="62" y="122" width="166" height="14" rx="7"/></g>
    </svg>
  </section>
</div>

<main class="card">
  <h1>동아일보 채용 인스타그램 대시보드</h1>
  <p class="sub">내부 구성원 전용이에요. 처음이면 열람 신청을 하고, 승인되면 메일과 PIN으로 로그인할 수 있어요.</p>

  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" id="tabLogin" aria-selected="true">로그인</button>
    <button type="button" class="tab" role="tab" id="tabRequest" aria-selected="false">열람 신청</button>
  </div>

  <form id="loginForm">
    <div class="field">
      <label for="loginEmail">회사 메일</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="name@donga.com" required>
    </div>
    <div class="field">
      <label for="loginPin">PIN (숫자 4자리)</label>
      <input id="loginPin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" required>
    </div>
    <button type="submit" class="primary" id="loginBtn">로그인</button>
  </form>

  <form id="requestForm" hidden>
    <div class="row">
      <div class="field">
        <label for="reqName">이름</label>
        <input id="reqName" maxlength="30" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="reqDept">부서</label>
        <input id="reqDept" maxlength="40" placeholder="예: 인사팀" required>
      </div>
    </div>
    <div class="field">
      <label for="reqEmail">회사 메일</label>
      <input id="reqEmail" type="email" autocomplete="email" placeholder="name@donga.com" required>
    </div>
    <div class="row">
      <div class="field">
        <label for="reqPin">PIN 정하기 (숫자 4자리)</label>
        <input id="reqPin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="reqPin2">PIN 확인</label>
        <input id="reqPin2" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" required>
      </div>
    </div>
    <button type="submit" class="primary" id="requestBtn">열람 신청</button>
  </form>

  <div class="msg" id="msg" role="status"></div>
  <div class="hint">@donga.com, @ichannela.com 메일만 신청할 수 있어요. 승인은 한 번이면 계속 유지되고, 들어올 때마다 메일과 PIN으로 로그인해요(브라우저를 닫거나 12시간이 지나면 다시 로그인).</div>
</main>
<script>
  // 배경 모션그래픽. 장면 1: 실제 월별 팔로워 추이 곡선을 반복해서 그린다.
  // 장면 2: 좋아요가 계속 늘어난다(최고 반응 게시물 947개에서 시작). 커서 두 개가 장면 사이를 오가며 반응을 일으킨다.
  (function () {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stage = document.querySelector('.stage');
    const $s = (sel) => stage.querySelector(sel);
    const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
    const ease = (t) => 1 - Math.pow(1 - t, 3);

    // --- 장면 1: 팔로워 성장 곡선 ---
    const series = [17, 54, 256, 316, 351, 364, 608, 1100, 1178, 1730, 2372, 3116, 3093];
    const W = 240, H = 100, max = Math.max(...series);
    const pts = series.map((v, i) => [(i / (series.length - 1)) * W, H - (v / max) * (H - 8)]);
    const line = $s('#growthLine'), area = $s('#growthArea'), dot = $s('#growthDot');
    function drawGrowth(p) {
      p = Math.min(1, Math.max(0, p));
      const upto = p * (pts.length - 1), k = Math.min(Math.floor(upto), pts.length - 1), f = upto - k;
      const shown = pts.slice(0, k + 1);
      if (k < pts.length - 1) shown.push([pts[k][0] + (pts[k + 1][0] - pts[k][0]) * f, pts[k][1] + (pts[k + 1][1] - pts[k][1]) * f]);
      const d = shown.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
      const last = shown[shown.length - 1];
      line.setAttribute('d', d);
      area.setAttribute('d', d + ` L${last[0].toFixed(1)} ${H} L0 ${H} Z`);
      dot.setAttribute('cx', last[0]);
      dot.setAttribute('cy', last[1]);
    }

    // --- 장면 2: 계속 늘어나는 좋아요 ---
    const likesEl = $s('#pLikes'), likesRow = $s('.likes-row');
    let likes = 947;
    likesEl.textContent = fmt(likes);
    function addLikes(n) {
      likes += n;
      likesEl.textContent = fmt(likes);
      const pop = document.createElement('span');
      pop.className = 'like-pop';
      pop.textContent = '+' + n;
      pop.style.left = (likesRow.offsetLeft + likesRow.offsetWidth - 6) + 'px';
      pop.style.top = (likesRow.offsetTop - 4) + 'px';
      likesRow.parentElement.appendChild(pop);
      setTimeout(() => pop.remove(), 1000);
    }

    if (reduced) { drawGrowth(1); return; }

    const PERIOD = 9000;
    let start = null;
    function frame(now) {
      if (start === null) start = now;
      const t = Math.max(0, ((now - start) % PERIOD) / PERIOD);
      drawGrowth(t < 0.7 ? ease(t / 0.7) : 1); // 70% 동안 그리고, 나머지는 완성된 상태로 잠시 멈춤
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // 하트가 떠오르는 박자에 맞춰 좋아요가 조금씩 계속 올라간다
    setInterval(() => { if (!document.hidden) addLikes(1 + Math.floor(Math.random() * 3)); }, 1100);

    // --- 알림 ---
    const toast = $s('#toast');
    const notes = [
      ['s-profile', '새 팔로워 +12'], ['s-likes', '저장 +8 · 공유 +3'], ['s-interview', '댓글 · "직무 인터뷰 더 보고 싶어요!"'],
      ['s-session', '설명회 신청 +27'], ['s-likes', '댓글 · "지원 언제 시작해요?"'], ['s-profile', '프로필 방문 +40']
    ];
    let ni = 0;
    function showToast() {
      if (document.hidden) return;
      const [cls, text] = notes[ni++ % notes.length];
      const r = $s('.' + cls).getBoundingClientRect();
      toast.textContent = text;
      toast.style.left = Math.max(12, Math.min(window.innerWidth - 260, r.left + 20)) + 'px';
      toast.style.top = Math.max(12, r.top - 40) + 'px';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2600);
    }
    setInterval(showToast, 5200);

    // --- 커서: 장면 사이를 오가며 클릭 → 장면이 반응 ---
    const hot = {
      's-profile': (r) => [r.left + r.width * 0.86, r.top + r.height * 0.42],
      's-likes': (r) => [r.left + 30, r.bottom - 22],
      's-interview': (r) => [r.left + r.width * 0.5, r.top + r.height * 0.6],
      's-session': (r) => [r.left + r.width * 0.68, r.top + r.height * 0.3]
    };
    const react = {
      's-likes': (el) => { el.classList.remove('burst'); void el.offsetWidth; el.classList.add('burst'); addLikes(4 + Math.floor(Math.random() * 6)); },
      's-interview': (el) => { el.classList.add('talking'); setTimeout(() => el.classList.remove('talking'), 2200); },
      's-session': (el) => el.querySelectorAll('.bar').forEach((b) => { b.style.animation = 'none'; void b.getBoundingClientRect(); b.style.animation = ''; }),
      's-profile': () => { start = null; }
    };
    function flash(el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 700); }
    function runCursor(cur, route, delay) {
      let i = 0;
      function step() {
        if (document.hidden || getComputedStyle(cur).display === 'none') return setTimeout(step, 1500);
        const cls = route[i++ % route.length];
        const el = $s('.' + cls), [x, y] = hot[cls](el.getBoundingClientRect());
        cur.style.transform = `translate(${x}px, ${y}px)`;
        setTimeout(() => {
          cur.classList.remove('click'); void cur.offsetWidth; cur.classList.add('click');
          flash(el);
          react[cls](el);
          setTimeout(step, 1300 + Math.random() * 900);
        }, 1750);
      }
      setTimeout(step, delay);
    }
    runCursor($s('#cursor1'), ['s-profile', 's-session', 's-likes', 's-interview'], 600);
    runCursor($s('#cursor2'), ['s-likes', 's-interview', 's-session', 's-likes', 's-profile'], 1800);

    // 다른 탭으로 가면 CSS 애니메이션도 멈춘다
    document.addEventListener('visibilitychange', () => stage.classList.toggle('paused', document.hidden));
  })();

  const $ = (id) => document.getElementById(id);
  const say = (text, kind) => { $('msg').textContent = text; $('msg').className = 'msg ' + (kind || ''); };
  function showTab(which) {
    const login = which === 'login';
    $('tabLogin').setAttribute('aria-selected', String(login));
    $('tabRequest').setAttribute('aria-selected', String(!login));
    $('loginForm').hidden = !login;
    $('requestForm').hidden = login;
    say('');
  }
  $('tabLogin').addEventListener('click', () => showTab('login'));
  $('tabRequest').addEventListener('click', () => showTab('request'));

  async function post(url, body) {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || '요청에 실패했어요.');
    return json;
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginBtn').disabled = true;
    try {
      await post('/api/auth/login', { email: $('loginEmail').value, pin: $('loginPin').value });
      say('확인됐어요. 이동하는 중...', 'ok');
      location.replace('/');
    } catch (err) { say(err.message, 'err'); $('loginBtn').disabled = false; }
  });

  $('requestForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!/^\d{4}$/.test($('reqPin').value)) return say('PIN은 숫자 4자리로 정해주세요.', 'err');
    if ($('reqPin').value !== $('reqPin2').value) return say('PIN 두 칸이 서로 달라요.', 'err');
    $('requestBtn').disabled = true;
    try {
      await post('/api/auth/request', { name: $('reqName').value, dept: $('reqDept').value, email: $('reqEmail').value, pin: $('reqPin').value });
      const email = $('reqEmail').value.trim();
      $('requestForm').reset();
      showTab('login');
      $('loginEmail').value = email;
      say('신청했어요. 관리자가 승인하면 이 메일과 PIN으로 로그인할 수 있어요.', 'ok');
    } catch (err) { say(err.message, 'err'); }
    $('requestBtn').disabled = false;
  });
</script>
</body>
</html>
