<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>로그인 · 동아일보 채용 인스타그램 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --ink: #1d1f23; --ink-2: #4b5059; --mute: #8a8f98; --line: #e3e6ea; --soft: #f3f4f6; --bg: #f6f7f9;
    --accent: #1f9e7f; /* 브랜드 녹색은 포인트로만 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    font-family: 'Pretendard', -apple-system, sans-serif; color: var(--ink);
    background-color: var(--bg);
    background-image: radial-gradient(rgba(29, 31, 35, .07) 1px, transparent 1px);
    background-size: 22px 22px;
    overflow-x: hidden;
  }
  ::selection { background: #d5efe7; color: var(--ink); }
  .card { position: relative; z-index: 2; width: 100%; max-width: 400px; background: #fff; border-radius: 20px; padding: 30px 28px;
    border: 1px solid #eceef1; box-shadow: 0 24px 60px rgba(17, 24, 39, .10), 0 2px 6px rgba(17, 24, 39, .04); }
  h1 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }
  .sub { margin: 0 0 20px; font-size: 13px; color: var(--ink-2); line-height: 1.6; }
  .tabs { display: flex; gap: 4px; background: var(--soft); padding: 4px; border-radius: 10px; margin-bottom: 20px; }
  .tab { flex: 1; padding: 9px; border: none; border-radius: 7px; background: none; font: inherit; font-size: 14px; font-weight: 700; color: var(--mute); cursor: pointer; }
  .tab[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.10); }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
  input { width: 100%; font: inherit; font-size: 15px; padding: 11px 12px; border: 1px solid #dcdfe4; border-radius: 9px; color: var(--ink); background: #fff; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .pin { letter-spacing: 0.35em; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  button.primary {
    width: 100%; margin-top: 6px; padding: 12px; border: none; border-radius: 9px; font: inherit; font-size: 14.5px; font-weight: 700;
    color: #fff; background: var(--ink); cursor: pointer; transition: background .2s;
  }
  button.primary:hover { background: #000; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 13px; line-height: 1.5; }
  .msg.err { color: #c8283f; }
  .msg.ok { color: #157a61; }
  .hint { margin-top: 16px; padding-top: 14px; border-top: 1px solid #eceef1; font-size: 12px; color: var(--mute); line-height: 1.6; }

  /* ---------- 배경: 밝은 바탕 + 은은한 색 번짐 + 흰 카드 네 장면(성장·좋아요·인터뷰·설명회) ---------- */
  .stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(34px); opacity: .75; animation: float 18s ease-in-out infinite alternate; }
  .blob.b-orange { width: 200px; height: 200px; top: 38%; left: 30%; background: radial-gradient(circle, #ffad5c, #ff9a3c 60%, transparent 72%); animation-delay: -3s; }
  .blob.b-blue { width: 260px; height: 260px; top: -60px; right: 22%; background: radial-gradient(circle, #8fc3ff, #6aaeff 60%, transparent 72%); animation-delay: -9s; }
  .blob.b-purple { width: 280px; height: 280px; bottom: -90px; left: -60px; background: radial-gradient(circle, #d2b2ff, #b98cff 60%, transparent 72%); animation-delay: -6s; }
  .blob.b-green { width: 170px; height: 170px; bottom: 6%; right: 26%; background: radial-gradient(circle, #8fe0c6, #5cc9a7 60%, transparent 72%); opacity: .6; }
  @keyframes float { from { transform: translate(0, 0) scale(1); } to { transform: translate(30px, -24px) scale(1.08); } }
  .stage::after { /* 카드 뒤를 밝게 눌러 글씨에 시선이 모이게 */
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 30% 44% at 50% 50%, rgba(246, 247, 249, .9), transparent 75%);
  }
  .scene {
    position: absolute; width: clamp(280px, calc(50vw - 360px), 420px); padding: 16px 18px 18px; border-radius: 18px;
    background: #fff; border: 1px solid rgba(17, 24, 39, .05);
    box-shadow: 0 16px 40px rgba(17, 24, 39, .08), 0 2px 6px rgba(17, 24, 39, .04); color: var(--ink);
    animation: drift 14s ease-in-out infinite alternate;
  }
  .scene svg { display: block; width: 100%; height: auto; overflow: visible; }
  /* 네 장면을 살짝 어긋나게 흩어 놓는다(크기·높이·여백이 조금씩 다르게) */
  .s-profile { top: 8vh; left: 5vw; }
  .s-likes { top: 11vh; right: 8vw; width: clamp(210px, calc(28vw - 250px), 270px); padding: 12px 12px 14px; animation-delay: -4s; } /* 인스타 게시물처럼 세로형 */
  .s-interview { bottom: 8vh; left: 9vw; width: clamp(260px, calc(50vw - 390px), 390px); animation-delay: -8s; }
  .s-session { bottom: 12vh; right: 4vw; animation-delay: -2s; }
  @keyframes drift { from { transform: translateY(-6px); } to { transform: translateY(8px); } }

  .sc-num { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--ink); }

  /* 장면 1: 프로필 */
  .prof { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .prof-ring { width: 42px; height: 42px; border-radius: 50%; padding: 2px; background: conic-gradient(#ff9a3c, #b98cff, #6aaeff, #5cc9a7, #ff9a3c); flex-shrink: 0; }
  .prof-ring span { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; border: 2px solid #fff; }
  .prof-ring svg { width: 100%; height: 100%; }
  .prof-handle { font-size: clamp(13px, 1vw, 16px); font-weight: 800; color: var(--ink); }
  .growth-line { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .growth-area { fill: url(#growthFill); }

  /* 장면 2: 좋아요 */
  .post-tile { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 5; background: var(--soft); transition: aspect-ratio .6s ease; }
  .post-tile svg.cover { position: absolute; inset: 0; }
  .post-tile .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.1s ease; }
  .post-tile .shot.on { opacity: 1; }
  .post-tile.has-shot svg.cover { display: none; }
  .likes-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: clamp(12px, .9vw, 15px); color: var(--ink-2); }
  .scene .likes-row svg { width: 18px; height: 18px; }
  .scene .post-tile .heart { position: absolute; bottom: 10px; right: 14px; width: 22px; height: 22px; opacity: 0;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .18));
    animation: rise 3.2s cubic-bezier(.16, 1, .3, 1) infinite; }
  .scene .post-tile .heart:nth-of-type(3) { right: 34px; width: 16px; height: 16px; animation-delay: .5s; }
  .scene .post-tile .heart:nth-of-type(4) { right: 8px; width: 18px; height: 18px; animation-delay: 1.1s; }
  .scene .post-tile .heart:nth-of-type(5) { right: 46px; width: 14px; height: 14px; animation-delay: 1.6s; }
  .scene .post-tile .heart:nth-of-type(6) { right: 22px; width: 20px; height: 20px; animation-delay: 2.2s; }
  .scene .post-tile .heart:nth-of-type(7) { right: 58px; width: 15px; height: 15px; animation-delay: 2.7s; }
  @keyframes rise {
    0% { opacity: 0; transform: translate(0, 0) scale(.6); }
    15% { opacity: 1; transform: translate(-3px, -18px) scale(1.05); }
    70% { opacity: .9; }
    100% { opacity: 0; transform: translate(10px, -150px) scale(.9); }
  }

  /* 장면 3: 인터뷰 */
  .bubble { opacity: 0; animation: talk 6s ease-in-out infinite; }
  .bubble.b2 { animation-delay: 3s; }
  @keyframes talk { 0%, 8% { opacity: 0; transform: translateY(4px); } 14%, 44% { opacity: 1; transform: none; } 50%, 100% { opacity: 0; } }
  .dot { animation: blink 1.2s ease-in-out infinite; }
  .dot:nth-child(3) { animation-delay: .2s; } .dot:nth-child(4) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .rec { animation: rec 1.6s steps(1) infinite; }
  @keyframes rec { 50% { opacity: .2; } }

  /* 장면 4: 설명회 */
  .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 5s cubic-bezier(.16, 1, .3, 1) infinite; }
  .bar:nth-of-type(2) { animation-delay: .25s; } .bar:nth-of-type(3) { animation-delay: .5s; } .bar:nth-of-type(4) { animation-delay: .75s; }
  @keyframes grow { 0% { transform: scaleY(.08); } 35%, 85% { transform: scaleY(1); } 100% { transform: scaleY(.08); } }
  .head { transform-box: fill-box; transform-origin: bottom; animation: nod 3.4s ease-in-out infinite; }
  .head:nth-child(2n) { animation-delay: -1.2s; } .head:nth-child(3n) { animation-delay: -2.3s; }
  @keyframes nod { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
  .pointer { transform-box: view-box; transform-origin: 0 0; animation: point 5s ease-in-out infinite; }
  @keyframes point { 0%, 100% { transform: rotate(0deg); } 40%, 70% { transform: rotate(-22deg); } }

  @media (max-width: 760px) {
    .s-interview, .s-session, .toast { display: none; }
    .scene { width: 300px; opacity: .5; }
    .s-profile { top: 2vh; left: -40px; } .s-likes { top: auto; bottom: 2vh; right: -30px; }
  }
  /* 로그인 성공: 장면들이 카드로 빨려 들어가고 카드가 살짝 커지며 넘어간다 */
  body.entering .card { transition: transform .7s cubic-bezier(.16, 1, .3, 1), box-shadow .7s; transform: scale(1.03); box-shadow: 0 30px 80px rgba(17, 24, 39, .16); }

  /* 가끔 떠오르는 알림(어두운 말풍선) */
  .toast { position: absolute; z-index: 3; padding: 8px 13px; border-radius: 10px; font-size: 12px; font-weight: 600; color: #fff;
    background: var(--ink); box-shadow: 0 12px 28px rgba(17, 24, 39, .18); opacity: 0; transform: translateY(8px);
    transition: opacity .35s ease, transform .5s cubic-bezier(.16, 1, .3, 1); white-space: nowrap; }
  .toast::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #5cc9a7; margin-right: 7px; vertical-align: 1px; }
  .toast.show { opacity: 1; transform: none; }
  .like-pop { position: absolute; font-size: 11px; font-weight: 800; color: #e8455c; pointer-events: none; animation: pop 1s cubic-bezier(.16, 1, .3, 1) forwards; }
  @keyframes pop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-16px); } }
  .scene.burst .post-tile { animation: thump .45s cubic-bezier(.16, 1, .3, 1); }
  @keyframes thump { 40% { transform: scale(1.03); } }

  .stage.paused, .stage.paused * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) {
    .scene, .blob, .bubble, .dot, .rec, .bar, .head, .pointer { animation: none !important; }
    .toast { display: none; }
    .bubble { opacity: 1; } .scene .post-tile .heart { display: none; }
  }
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
  <div class="blob b-blue"></div><div class="blob b-purple"></div><div class="blob b-orange"></div><div class="blob b-green"></div>
  <div class="toast" id="toast"></div>

  <section class="scene s-profile">
    <div class="prof">
      <div class="prof-ring"><span><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="11" fill="none" stroke="#1d1f23" stroke-width="2"/><path d="M9 20h22M20 9v22M12.5 12.5l15 15M27.5 12.5l-15 15" stroke="#1d1f23" stroke-width="1.4"/></svg></span></div>
      <div class="prof-handle">donga_recruit</div>
    </div>
    <svg viewBox="0 0 240 116" role="presentation">
      <defs><linearGradient id="growthFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1f23" stop-opacity=".12"/><stop offset="1" stop-color="#1d1f23" stop-opacity="0"/></linearGradient></defs>
      <path class="growth-area" id="growthArea" d=""/>
      <path class="growth-line" id="growthLine" d=""/>
      <line x1="0" y1="104" x2="240" y2="104" stroke="#e3e6ea"/>
      <circle id="growthDot" r="4.5" fill="#1f9e7f" stroke="#fff" stroke-width="2" cx="-10" cy="-10"/>
      <text x="240" y="116" font-size="9" fill="#8a8f98" font-weight="600" text-anchor="end">팔로워 지속 상승!</text>
    </svg>
  </section>

  <section class="scene s-likes">
    <div class="post-tile">
      <img class="shot" alt="" referrerpolicy="no-referrer"><img class="shot" alt="" referrerpolicy="no-referrer">
      <svg class="cover" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="10" y="14" width="56" height="7" rx="3" fill="#1d1f23" opacity=".8"/><rect x="10" y="26" width="40" height="5" rx="2.5" fill="#8a8f98" opacity=".6"/><rect x="10" y="62" width="80" height="24" rx="5" fill="#fff"/><rect x="16" y="68" width="46" height="4" rx="2" fill="#1d1f23" opacity=".7"/><rect x="16" y="76" width="30" height="4" rx="2" fill="#8a8f98" opacity=".6"/><circle cx="80" cy="30" r="10" fill="#ff9a3c" opacity=".45"/></svg>
      <svg class="heart" viewBox="0 0 24 24" fill="#f0506e"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg class="heart" viewBox="0 0 24 24" fill="#ff7d93"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg class="heart" viewBox="0 0 24 24" fill="#f0506e"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg class="heart" viewBox="0 0 24 24" fill="#ffb3c0"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg class="heart" viewBox="0 0 24 24" fill="#f0506e"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <svg class="heart" viewBox="0 0 24 24" fill="#ff7d93"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </div>
    <div class="likes-row"><svg viewBox="0 0 24 24" fill="#f0506e"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg><span>좋아요 <b class="sc-num" id="pLikes">0</b>개</span></div>
  </section>

  <section class="scene s-interview">
    <svg viewBox="0 0 240 132" role="presentation">
      <rect x="0" y="0" width="240" height="132" rx="10" fill="#f3f4f6"/>
      <circle class="rec" cx="14" cy="14" r="4" fill="#ff8a3d"/><text x="24" y="17.5" font-size="9.5" fill="#1d1f23" font-weight="700">INTERVIEW</text>
      <!-- 진행자 -->
      <circle cx="62" cy="64" r="13" fill="#c9cdd4"/><path d="M40 118c0-17 10-28 22-28s22 11 22 28z" fill="#8a8f98"/>
      <!-- 현직자 -->
      <circle cx="176" cy="62" r="13" fill="#d9dce1"/><path d="M154 118c0-17 10-28 22-28s22 11 22 28z" fill="#1d1f23"/>
      <!-- 마이크 -->
      <rect x="114" y="74" width="9" height="16" rx="4.5" fill="#4b5059"/><path d="M118.5 90v22M108 112h21" stroke="#4b5059" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="20" y="118" width="200" height="5" rx="2.5" fill="#dfe2e6"/>
      <g class="bubble"><rect x="20" y="22" width="64" height="24" rx="12" fill="#fff" stroke="#e3e6ea"/><circle class="dot" cx="40" cy="34" r="3" fill="#8a8f98"/><circle class="dot" cx="52" cy="34" r="3" fill="#8a8f98"/><circle class="dot" cx="64" cy="34" r="3" fill="#8a8f98"/></g>
      <g class="bubble b2"><rect x="146" y="20" width="76" height="24" rx="12" fill="#1d1f23"/><rect x="156" y="27" width="56" height="4" rx="2" fill="#fff"/><rect x="156" y="35" width="36" height="4" rx="2" fill="#5cc9a7"/></g>
    </svg>
  </section>

  <section class="scene s-session">
    <svg viewBox="0 0 240 140" role="presentation">
      <!-- 스크린 -->
      <rect x="64" y="6" width="168" height="78" rx="8" fill="#1d1f23"/>
      <circle cx="74" cy="15" r="2" fill="#ff6b6b"/><circle cx="81" cy="15" r="2" fill="#ffc94d"/><circle cx="88" cy="15" r="2" fill="#5cc9a7"/>
      <text x="76" y="32" font-size="10" fill="#fff" font-weight="800">채용설명회</text>
      <rect class="bar" x="152" y="44" width="12" height="32" rx="2" fill="#4b5059"/>
      <rect class="bar" x="170" y="34" width="12" height="42" rx="2" fill="#6b7079"/>
      <rect class="bar" x="188" y="26" width="12" height="50" rx="2" fill="#9aa0a8"/>
      <rect class="bar" x="206" y="16" width="12" height="60" rx="2" fill="#5cc9a7"/>
      <rect x="76" y="40" width="56" height="4" rx="2" fill="#9aa0a8" opacity=".7"/><rect x="76" y="48" width="40" height="4" rx="2" fill="#9aa0a8" opacity=".45"/>
      <!-- 발표자 -->
      <circle cx="30" cy="46" r="11" fill="#c9cdd4"/><path d="M12 104c0-22 7-40 18-40s18 18 18 40z" fill="#8a8f98"/>
      <g transform="translate(40 66)"><g class="pointer"><path d="M0 0l30 -6" stroke="#1d1f23" stroke-width="3" stroke-linecap="round"/></g></g>
      <!-- 지원자들 -->
      <g fill="#c9cdd4">
        <circle class="head" cx="72" cy="112" r="8"/><circle class="head" cx="96" cy="114" r="8"/><circle class="head" cx="120" cy="112" r="8"/><circle class="head" cx="144" cy="114" r="8"/><circle class="head" cx="168" cy="112" r="8"/><circle class="head" cx="192" cy="114" r="8"/><circle class="head" cx="216" cy="112" r="8"/>
      </g>
      <g fill="#e3e6ea"><rect x="62" y="122" width="166" height="14" rx="7"/></g>
    </svg>
  </section>
</div>

<main class="card">
  <h1>동아일보 채용 인스타그램 대시보드</h1>
  <p class="sub">내부 구성원 전용이에요. 처음이면 열람 신청을 하고, 승인되면 메일과 PIN으로 로그인할 수 있어요.</p>

  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" id="tabLogin" aria-selected="true">로그인</button>
    <button type="button" class="tab" role="tab" id="tabRequest" aria-selected="false">열람 신청</button>
  </div>

  <form id="loginForm">
    <div class="field">
      <label for="loginEmail">회사 메일</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="name@donga.com" required>
    </div>
    <div class="field">
      <label for="loginPin">PIN (숫자 4자리)</label>
      <input id="loginPin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" required>
    </div>
    <button type="submit" class="primary" id="loginBtn">로그인</button>
  </form>

  <form id="requestForm" hidden>
    <div class="row">
      <div class="field">
        <label for="reqName">이름</label>
        <input id="reqName" maxlength="30" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="reqDept">부서</label>
        <input id="reqDept" maxlength="40" placeholder="예: 인사팀" required>
      </div>
    </div>
    <div class="field">
      <label for="reqEmail">회사 메일</label>
      <input id="reqEmail" type="email" autocomplete="email" placeholder="name@donga.com" required>
    </div>
    <div class="row">
      <div class="field">
        <label for="reqPin">PIN 정하기 (숫자 4자리)</label>
        <input id="reqPin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="reqPin2">PIN 확인</label>
        <input id="reqPin2" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" required>
      </div>
    </div>
    <button type="submit" class="primary" id="requestBtn">열람 신청</button>
  </form>

  <div class="msg" id="msg" role="status"></div>
  <div class="hint">@donga.com, @ichannela.com 메일만 신청할 수 있어요. 승인은 한 번이면 계속 유지되고, 들어올 때마다 메일과 PIN으로 로그인해요(브라우저를 닫거나 12시간이 지나면 다시 로그인).</div>
</main>
<script>
  // 배경 모션그래픽. 장면 1: 끝없이 자라는 팔로워 곡선. 장면 2: 실제 최근 게시물 썸네일 + 계속 늘어나는 좋아요.
  (function () {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stage = document.querySelector('.stage');
    const $s = (sel) => stage.querySelector(sel);
    const fmt = (n) => Math.round(n).toLocaleString('ko-KR');

    // --- 장면 1: 끝없이 자라는 팔로워 곡선 ---
    // 고정된 숫자 대신, 오른쪽으로 계속 이어지며 대체로 올라가는 곡선을 그린다(가끔 살짝 내려가도 추세는 위).
    // 보이는 구간을 늘 위아래로 꽉 차게 맞춰서, 언제 봐도 "자라는 중"으로 보인다.
    const W = 240, H = 100, N = 40;
    const line = $s('#growthLine'), area = $s('#growthArea'), dot = $s('#growthDot');
    let vals = [], v = 100;
    for (let i = 0; i < N + 1; i++) { v += 2 + Math.random() * 6 - (Math.random() < 0.15 ? 9 : 0); vals.push(v); }
    let shift = 0;
    function drawGrowth(dt) {
      shift += dt / 380; // 약 0.4초마다 한 칸씩 흐른다
      while (shift >= 1) { shift -= 1; vals.shift(); v += 2 + Math.random() * 6 - (Math.random() < 0.15 ? 9 : 0); vals.push(v); }
      const lo = Math.min(...vals), hi = Math.max(...vals), step = W / (N - 1);
      const pts = vals.map((y, i) => [(i - shift) * step, H - 6 - ((y - lo) / (hi - lo || 1)) * (H - 18)]);
      const d = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
      const last = pts[pts.length - 2];
      line.setAttribute('d', d);
      area.setAttribute('d', d + ` L${pts[pts.length - 1][0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`);
      dot.setAttribute('cx', last[0]);
      dot.setAttribute('cy', last[1]);
    }

    // --- 장면 2: 계속 늘어나는 좋아요 ---
    const likesEl = $s('#pLikes'), likesRow = $s('.likes-row'), likesScene = $s('.s-likes');
    let likes = 947;
    likesEl.textContent = fmt(likes);
    function addLikes(n) {
      likes += n;
      likesEl.textContent = fmt(likes);
      const pop = document.createElement('span');
      pop.className = 'like-pop';
      pop.textContent = '+' + n;
      pop.style.left = (likesRow.offsetLeft + likesRow.offsetWidth - 6) + 'px';
      pop.style.top = (likesRow.offsetTop - 4) + 'px';
      likesRow.parentElement.appendChild(pop);
      setTimeout(() => pop.remove(), 1000);
    }

    // --- 장면 2 배경: 우리 계정 최근 게시물 썸네일 5장을 몇 초마다 넘긴다(불러오지 못하면 그림으로 남는다) ---
    const shots = [...stage.querySelectorAll('.post-tile .shot')], tile = $s('.post-tile'), ratio = {};
    // 사진이 잘리지 않게 칸 비율을 그 사진의 원래 가로세로 비율에 맞춘다(세로형 3:4, 4:5 등)
    const fitTile = (src) => { const r = ratio[src]; if (r) tile.style.aspectRatio = Math.min(Math.max(r, 0.56), 1.91).toFixed(4); };
    fetch('/api/auth/showcase').then((r) => r.json()).then(({ images }) => {
      const ok = [];
      let shown = 0;
      (images || []).forEach((src) => {
        const im = new Image();
        im.referrerPolicy = 'no-referrer';
        im.onload = () => {
          ok.push(src);
          ratio[src] = im.naturalWidth / im.naturalHeight;
          if (ok.length === 1) { shots[0].src = src; shots[0].classList.add('on'); fitTile(src); tile.classList.add('has-shot'); }
        };
        im.src = src;
      });
      if (reduced) return;
      setInterval(() => {
        if (ok.length < 2 || document.hidden) return;
        shown = (shown + 1) % ok.length;
        const next = shots.find((x) => !x.classList.contains('on')), cur = shots.find((x) => x.classList.contains('on'));
        next.src = ok[shown];
        next.onload = () => { fitTile(ok[shown]); next.classList.add('on'); cur && cur.classList.remove('on'); };
      }, 4200);
    }).catch(() => {});

    if (reduced) { drawGrowth(0); return; }

    const card = document.querySelector('.card');
    const scenes = [...stage.querySelectorAll('.scene')];

    let prev = null;
    function frame(now) {
      const dt = prev === null ? 16 : Math.min(64, Math.max(0, now - prev));
      prev = now;
      drawGrowth(dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // 하트가 떠오르는 박자에 맞춰 좋아요가 조금씩 계속 올라가고, 가끔 한꺼번에 몰린다
    setInterval(() => { if (!document.hidden) addLikes(1 + Math.floor(Math.random() * 3)); }, 1100);
    setInterval(() => {
      if (document.hidden) return;
      likesScene.classList.remove('burst'); void likesScene.offsetWidth; likesScene.classList.add('burst');
      addLikes(5 + Math.floor(Math.random() * 6));
    }, 6800);

    // --- 알림 ---
    const toast = $s('#toast');
    const notes = [
      ['s-profile', '새 팔로워 +12'], ['s-likes', '저장 +8 · 공유 +3'], ['s-interview', '댓글 · "직무 인터뷰 더 보고 싶어요!"'],
      ['s-session', '설명회 신청 +27'], ['s-likes', '댓글 · "지원 언제 시작해요?"'], ['s-profile', '프로필 방문 +40']
    ];
    let ni = 0;
    function showToast() {
      if (document.hidden) return;
      const [cls, text] = notes[ni++ % notes.length];
      const r = $s('.' + cls).getBoundingClientRect();
      toast.textContent = text;
      toast.style.left = Math.max(12, Math.min(window.innerWidth - 260, r.left + 20)) + 'px';
      toast.style.top = Math.max(12, r.top - 40) + 'px';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2600);
    }
    setInterval(showToast, 5200);

    // 로그인 성공: 네 장면이 카드 쪽으로 빨려 들어간다(약 0.75초) → 그다음 이동
    window.playEnter = function () {
      document.body.classList.add('entering');
      const c = card.getBoundingClientRect(), cx = c.left + c.width / 2, cy = c.top + c.height / 2;
      scenes.forEach((el) => {
        const r = el.getBoundingClientRect();
        el.style.animation = 'none';
        el.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${cx - (r.left + r.width / 2)}px, ${cy - (r.top + r.height / 2)}px) scale(.12)`, opacity: 0 }],
          { duration: 700, easing: 'cubic-bezier(.65, 0, .35, 1)', fill: 'forwards' });
      });
      return new Promise((res) => setTimeout(res, 750));
    };

    // 다른 탭으로 가면 CSS 애니메이션도 멈춘다
    document.addEventListener('visibilitychange', () => stage.classList.toggle('paused', document.hidden));
  })();

  const $ = (id) => document.getElementById(id);
  const say = (text, kind) => { $('msg').textContent = text; $('msg').className = 'msg ' + (kind || ''); };
  function showTab(which) {
    const login = which === 'login';
    $('tabLogin').setAttribute('aria-selected', String(login));
    $('tabRequest').setAttribute('aria-selected', String(!login));
    $('loginForm').hidden = !login;
    $('requestForm').hidden = login;
    say('');
  }
  $('tabLogin').addEventListener('click', () => showTab('login'));
  $('tabRequest').addEventListener('click', () => showTab('request'));

  async function post(url, body) {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || '요청에 실패했어요.');
    return json;
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginBtn').disabled = true;
    try {
      await post('/api/auth/login', { email: $('loginEmail').value, pin: $('loginPin').value });
      say('확인됐어요. 이동하는 중...', 'ok');
      if (window.playEnter) await window.playEnter();
      location.replace('/');
    } catch (err) { say(err.message, 'err'); $('loginBtn').disabled = false; }
  });

  $('requestForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!/^\d{4}$/.test($('reqPin').value)) return say('PIN은 숫자 4자리로 정해주세요.', 'err');
    if ($('reqPin').value !== $('reqPin2').value) return say('PIN 두 칸이 서로 달라요.', 'err');
    $('requestBtn').disabled = true;
    try {
      await post('/api/auth/request', { name: $('reqName').value, dept: $('reqDept').value, email: $('reqEmail').value, pin: $('reqPin').value });
      const email = $('reqEmail').value.trim();
      $('requestForm').reset();
      showTab('login');
      $('loginEmail').value = email;
      say('신청했어요. 관리자가 승인하면 이 메일과 PIN으로 로그인할 수 있어요.', 'ok');
    } catch (err) { say(err.message, 'err'); }
    $('requestBtn').disabled = false;
  });
</script>
</body>
</html>
