<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동아일보 채용 인스타그램 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <!-- TODO: public/assets/logo.png 파일을 넣으면 아래 img가 자동으로 로고를 표시해요 -->
      <img src="assets/logo.png" alt="동아일보 채용" class="sidebar-logo">
    </div>

    <nav class="sidebar-filters" id="filterBar">
      <div class="sidebar-widget">
        <div class="filter-block-label">게시 활동</div>
        <div id="postCalendar" class="post-calendar"></div>
      </div>

      <div class="sidebar-widget">
        <div id="quickStats" class="quick-stats"></div>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button id="syncBtn" class="btn-primary btn-block">지금 동기화</button>
      <div id="tokenBanner" class="token-banner" hidden></div>
    </div>
  </aside>

  <main class="content">

    <section class="kpi-hero-row">
      <div class="hero-card follower-hero" id="followerHero"></div>
      <div class="hero-card follower-hero" id="viewsMonthlyHero"></div>
      <div class="hero-card follower-hero" id="reachMonthlyHero"></div>
    </section>

    <nav class="tab-bar" id="tabBar">
      <button class="tab-btn is-active" data-tab="summary">① 요약</button>
      <button class="tab-btn" data-tab="details">② 세부 데이터</button>
      <button class="tab-btn" data-tab="posts">③ 전체 게시물</button>
    </nav>

    <div class="tab-panel" data-tab-panel="summary">
      <section class="panel-row">
        <div class="hero-card" id="latestPostHero"></div>
        <div class="hero-card" id="reachHero"></div>
      </section>

      <section class="panel">
        <h2>TOP 성과 게시물</h2>
        <div class="top-posts-groups">
          <div class="top-posts-group">
            <div class="top-posts-group-title">❤️ 좋아요 TOP 3</div>
            <div id="topPostsLikes" class="top-posts-mini"></div>
          </div>
          <div class="top-posts-group">
            <div class="top-posts-group-title">🔖 저장 TOP 3</div>
            <div id="topPostsSaves" class="top-posts-mini"></div>
          </div>
          <div class="top-posts-group">
            <div class="top-posts-group-title">🔁 공유 TOP 3</div>
            <div id="topPostsShares" class="top-posts-mini"></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>AI 인사이트</h2>
        <div id="insightList" class="insight-list"></div>
      </section>
    </div>

    <div class="tab-panel" data-tab-panel="details" hidden>
      <section class="panel-row">
        <div class="panel panel-half" id="demographicsPanel" hidden>
          <h2>팔로워 인구통계</h2>
          <div class="demographics-grid">
            <div class="demo-gender-col">
              <div class="demo-subtitle">성별</div>
              <div id="genderBadges" class="gender-badges"></div>
            </div>
            <div class="demo-age-col">
              <div class="demo-subtitle">연령대</div>
              <div class="chart-wrap chart-wrap-sm"><canvas id="ageChart"></canvas></div>
            </div>
          </div>
        </div>
        <div class="panel panel-half">
          <h2>팔로워 성장 추이 (월별)</h2>
          <div class="chart-wrap"><canvas id="followerChart"></canvas></div>
        </div>
      </section>

      <section class="panel-row">
        <div class="panel panel-half">
          <div class="panel-header-row">
            <h2>조회수 추이</h2>
            <select id="viewsGranularity" class="granularity-select">
              <option value="monthly">월별</option>
              <option value="daily">일별 (최근 1개월)</option>
            </select>
          </div>
          <div class="panel-desc">게시물이 올라간 달 기준, 그 게시물들의 현재까지 누적 조회수 합계예요</div>
          <div class="chart-wrap"><canvas id="viewsOnlyChart"></canvas></div>
        </div>
        <div class="panel panel-half">
          <div class="panel-header-row">
            <h2>도달 추이</h2>
            <select id="reachGranularity" class="granularity-select">
              <option value="monthly">월별</option>
              <option value="daily">일별 (최근 1개월)</option>
            </select>
          </div>
          <div class="panel-desc">계정을 본 서로 다른 사람 수(중복 제외)를 날짜별로 합산한 값이에요</div>
          <div class="chart-wrap"><canvas id="reachOnlyChart"></canvas></div>
        </div>
      </section>

      <section class="panel-row">
        <div class="panel panel-half">
          <h2>콘텐츠 유형별 참여율</h2>
          <div class="chart-wrap"><canvas id="mediaTypeChart"></canvas></div>
        </div>
        <div class="panel panel-half">
          <h2>카테고리별 참여율</h2>
          <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
        </div>
      </section>
    </div>

    <div class="tab-panel" data-tab-panel="posts" hidden>
      <section class="panel">
        <h2>최근 업로드 미리보기</h2>
        <div id="recentThumbs" class="recent-thumbs"></div>
      </section>

      <section class="panel">
        <div class="table-header">
          <h2>전체 게시물</h2>
          <span id="postsMeta" class="posts-meta"></span>
        </div>
        <div class="table-wrap">
          <table id="postsTable">
            <thead>
              <tr>
                <th></th>
                <th data-sort="timestamp">날짜 <span class="sort-arrow"></span></th>
                <th>내용</th>
                <th data-sort="media_type">유형 <span class="sort-arrow"></span></th>
                <th>카테고리</th>
                <th data-sort="like_count">좋아요 <span class="sort-arrow"></span></th>
                <th data-sort="comments_count">댓글 <span class="sort-arrow"></span></th>
                <th data-sort="saved">저장 <span class="sort-arrow"></span></th>
                <th data-sort="shares">공유 <span class="sort-arrow"></span></th>
                <th data-sort="reach">도달 <span class="sort-arrow"></span></th>
              </tr>
            </thead>
            <tbody id="postsTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

  </main>
</div>

<div id="postModal" class="modal-backdrop" hidden>
  <div class="modal-card">
    <button id="postModalClose" class="modal-close" aria-label="닫기">✕</button>
    <div id="postModalBody"></div>
  </div>
</div>

<div id="noteModal" class="modal-backdrop" hidden>
  <div class="modal-card modal-card-sm">
    <button id="noteModalClose" class="modal-close" aria-label="닫기">✕</button>
    <div class="note-modal-title">메모 <span id="noteModalPeriod"></span></div>
    <div id="noteModalValue" class="note-modal-value"></div>
    <textarea id="noteModalText" class="note-modal-textarea" placeholder="이 시점에 무슨 일이 있었는지 적어두세요 (예: 채용설명회 진행, 이벤트 게시물 업로드 등)"></textarea>
    <div class="note-modal-actions">
      <button id="noteModalDelete" class="btn-ghost" hidden>삭제</button>
      <button id="noteModalSave" class="btn-primary">저장</button>
    </div>
  </div>
</div>

<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
